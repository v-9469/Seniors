services:
  frontend:
    build: ./frontend
    ports:
      - "12001:12001"
    environment:
      - VITE_API_URL=http://localhost:12000
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "12000:12000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/seniors
      - JWT_SECRET=supersecretjwtkey_for_seniors
      - PORT=12000
      - ADMIN_PASSWORD=admin123
    depends_on:
      - mongodb

  mongodb:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
